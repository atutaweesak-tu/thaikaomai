services:
  web:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "8080:3001"
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      - ./.env:/app/.env:ro
    mem_limit: 1024m
    networks:
      - default
      - appnet

networks:
  default: {}
  appnet:
    name: thaikaomai_appnet
    external: true
